<div class="matches-list container mt-4">
  <div class="page-header d-flex justify-content-between align-items-center mb-4">
    <h1 class="page-title">Partite</h1>
    <a routerLink="/games/create" class="btn btn-primary"> Nuova Partita </a>
  </div>

  @if (store.isLoading()) {
    <div class="text-center py-5">
      <div class="spinner-border text-gold"></div>
      <p class="mt-3 text-gold">Caricamento Partite...</p>
    </div>
  } @else {
    <div class="filter-card mb-4">
      <form [formGroup]="filterForm">
        <div class="row g-3 align-items-end">
          <div class="col-md-2">
            <app-date-picker id="startDateFilter" label="Data inizio" formControlName="startDate" />
          </div>

          <div class="col-md-2">
            <app-date-picker id="endDateFilter" label="Data fine" formControlName="endDate" />
          </div>

          <div class="col-md-3">
            <label for="resultFilter" class="form-label">Esito vittoria</label>
            <select id="resultFilter" class="form-select" formControlName="result">
              <option value="GOOD_WIN">Servitori di Artù</option>
              <option value="EVIL_WIN">Servitori di Mordred</option>
            </select>
          </div>

          <div class="col-md-3">
            <label for="winTypeFilter" class="form-label">Tipologia vittoria</label>
            <select id="winTypeFilter" class="form-select" formControlName="winType">
              <option value="THREE_MISSIONS">Classica</option>
              <option value="ASSASSINATION">Assassinando Merlino</option>
            </select>
          </div>
          <div class="col-md-2">
            <button type="button" (click)="resetFilters()" class="btn btn-primary w-100">
              <i class="bi bi-arrow-clockwise"></i> Reset
            </button>
          </div>
        </div>
      </form>
    </div>
    <div class="game-list-wrapper table-responsive">
      <table class="table table-striped table-dark">
        <thead>
          <tr>
            <th>Data della partita</th>
            <th>Esito della partita</th>
            <th>Modalità di vittoria</th>
            <th></th>
          </tr>
        </thead>
        <tbody>
          @for (game of store.games(); track $index) {
            <tr>
              <td>{{ game.playedAt | date: 'dd/MM/yyyy HH:mm' }}</td>
              <td>{{ game.result }}</td>
              <td>{{ game.winType }}</td>
              <td class="text-end">
                <a routerLink="/games/{{ game.id }}" class="btn btn-primary btn-sm"
                  ><i class="bi bi-eye"></i
                ></a>
              </td>
            </tr>
          }
        </tbody>
      </table>
    </div>
  }
</div>
