<div class="row h-100 align-items-center">
  <div class="col-12 col-md-6 offset-md-3">
    <div class="card bg-medium-grey border border-gold">
      <div class="card-header text-center border-0">
        <h2 class="text-gold">Avalog</h2>
        <p class="text-light-muted">Registrati sulla piattaforma</p>
      </div>
      <div class="card-body">
        <form (ngSubmit)="onSubmit()" #registerForm="ngForm">
          @if (errorMessage) {
            <div class="alert alert-danger">
              {{ errorMessage }}
            </div>
          }

          <div class="mb-3">
            <label for="email" class="form-label">Email</label>
            <input
              type="email"
              class="form-control"
              id="email"
              name="email"
              [(ngModel)]="email"
              required
              email
              placeholder="Email"
            />
          </div>

          <div class="mb-3">
            <label for="username" class="form-label">Username</label>
            <input
              type="text"
              class="form-control"
              id="username"
              name="username"
              [(ngModel)]="username"
              required
              minlength="3"
              placeholder="Username"
            />
          </div>

          <div class="mb-3">
            <label for="displayName" class="form-label">Nome visualizzato</label>
            <input
              type="text"
              class="form-control"
              id="displayName"
              name="displayName"
              [(ngModel)]="displayName"
              required
              placeholder="Nome visualizzato"
            />
          </div>

          <div class="mb-3">
            <label for="password" class="form-label">Password</label>
            <input
              type="password"
              class="form-control"
              id="password"
              name="password"
              [(ngModel)]="password"
              required
              minlength="6"
              placeholder="Password"
            />
          </div>

          <div class="mb-3">
            <label for="confirmPassword" class="form-label">Conferma Password</label>
            <input
              type="password"
              class="form-control"
              id="confirmPassword"
              name="confirmPassword"
              [(ngModel)]="confirmPassword"
              required
              placeholder="Conferma Password"
            />
          </div>

          <button
            type="submit"
            class="btn btn-primary w-100"
            [disabled]="registerForm.invalid || isLoading"
          >
            @if (isLoading) {
              <span class="spinner-border spinner-border-sm me-2"></span>
              Registrazione in corso...
            } @else {
              Registrati
            }
          </button>
        </form>
      </div>

      <div class="card-footer border-0 text-center">
        <div class="border-top border-light-grey pt-3">
          <p class="text-light-muted">Hai già un account? <a routerLink="/auth/login">Accedi</a></p>
        </div>
      </div>
    </div>
  </div>
</div>
